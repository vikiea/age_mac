[package]
name = "age-mac-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Project automation CLI for the Age Mac repository"

[[bin]]
name = "age-mac"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
