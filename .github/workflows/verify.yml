name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Engine/go.mod

      - name: Swift build
        run: swift build

      - name: Go tests
        run: cd Engine && env -u GOROOT go test ./...

      - name: Whitespace check
        run: git diff --check
